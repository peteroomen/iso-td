<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>UFO Defense</title>
    <meta name="description" content="UFO Defense - an isometric tower defense game. Stop the alien invasion!" />
    <meta name="theme-color" content="#1a1438" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UFO Defense" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #120c1c;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed; /* no rubber-band / address-bar scroll on iOS */
        inset: 0;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: #120c1c;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
      /* "rotate your device" card: touch devices held upright (see installViewport) */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: radial-gradient(circle at 50% 40%, #3d3150, #120c1c 70%);
        color: #fff4d6;
        font: 26px/1.3 "Lilita One", "Trebuchet MS", sans-serif;
        letter-spacing: 0.04em;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        padding: 24px;
      }
      .rotate-needed #rotate {
        display: flex;
      }
      #rotate .phone {
        width: 54px;
        height: 96px;
        border: 6px solid #ffd34e;
        border-radius: 12px;
        animation: tilt 2.4s ease-in-out infinite;
      }
      #rotate small {
        font-size: 16px;
        opacity: 0.7;
      }
      @keyframes tilt {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      /* shown until the bundle boots; the canvas replaces it */
      #boot-msg {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff4d6;
        font: 24px/1 "Trebuchet MS", sans-serif;
        letter-spacing: 0.1em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-msg">LOADING...</div>
    <div id="rotate" aria-live="polite">
      <div class="phone"></div>
      <div>Rotate your device</div>
      <small>UFO Defense plays in landscape</small>
    </div>
    <script>
      // no browser context menu / pinch-zoom / double-tap zoom / drag-select on the game
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('dblclick', function (e) { e.preventDefault(); });
      document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
      window.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    </script>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
